# Минимальное воспроизведение ошибки FailedMount для обращения в поддержку.
apiVersion: v1
kind: Namespace
metadata:
  name: secret-mount-diagnosis
---
apiVersion: v1
kind: Secret
metadata:
  name: mount-probe
  namespace: secret-mount-diagnosis
type: Opaque
stringData:
  value: probe-ok
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-mount-probe
  namespace: secret-mount-diagnosis
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.36.1
      command: ["sh", "-c", "cat /probe/value; sleep 300"]
      volumeMounts:
        - name: mounted-secret
          mountPath: /probe
          readOnly: true
  volumes:
    - name: mounted-secret
      secret:
        secretName: mount-probe
