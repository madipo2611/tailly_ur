services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digital_notary
      POSTGRES_USER: digital_notary
      POSTGRES_PASSWORD: development-only
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U digital_notary -d digital_notary"], interval: 5s, timeout: 3s, retries: 10}
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    environment: {RABBITMQ_DEFAULT_USER: digital_notary, RABBITMQ_DEFAULT_PASS: development-only}
