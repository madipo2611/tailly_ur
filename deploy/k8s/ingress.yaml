apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-notary
  namespace: digital-notary
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [tailly.ru, www.tailly.ru]
    secretName: tailly-ru-tls
  rules:
  - host: tailly.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: document-api, port: {number: 80}}}
  - host: www.tailly.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: document-api, port: {number: 80}}}
