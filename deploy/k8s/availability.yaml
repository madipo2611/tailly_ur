apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: document-api, namespace: digital-notary}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: document-api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: document-api, namespace: digital-notary}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: document-api}
  minReplicas: 3
  maxReplicas: 12
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 30, policies: [{type: Percent, value: 100, periodSeconds: 60}]}
    scaleDown: {stabilizationWindowSeconds: 300, policies: [{type: Percent, value: 25, periodSeconds: 60}]}
