apiVersion: v1
kind: Namespace
metadata: {name: digital-notary}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: document-api, namespace: digital-notary}
spec:
  minReadySeconds: 5
  replicas: 3
  selector: {matchLabels: {app: document-api}}
  template:
    metadata:
      labels: {app: document-api}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      serviceAccountName: document-api
      containers:
      - name: api
        image: ghcr.io/madipo2611/digital-notary:671fa334a6c5447936a14e80e0e7c3a774c88a18
        ports: [{containerPort: 8080}]
        env: [{name: PORT, value: '8080'}]
        envFrom: [{secretRef: {name: digital-notary-runtime}}]
        volumeMounts:
        - name: postgres-ca
          mountPath: /etc/digital-notary
          readOnly: true
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}}
        readinessProbe: {httpGet: {path: /readyz, port: 8080}}
        startupProbe: {httpGet: {path: /healthz, port: 8080}, failureThreshold: 30, periodSeconds: 2}
      volumes:
      - name: postgres-ca
        secret:
          secretName: digital-notary-runtime
          items: [{key: postgres-ca.crt, path: postgres-ca.crt}]
---
apiVersion: v1
kind: Service
metadata: {name: document-api, namespace: digital-notary}
spec: {selector: {app: document-api}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: document-api, namespace: digital-notary}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-default-deny, namespace: digital-notary}
spec:
  podSelector: {matchLabels: {app: document-api}}
  policyTypes: [Ingress, Egress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]}]
  egress:
  - to: [{podSelector: {matchLabels: {app: postgres}}}]
    ports: [{protocol: TCP, port: 5432}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
