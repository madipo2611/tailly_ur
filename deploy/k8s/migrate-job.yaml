apiVersion: batch/v1
kind: Job
metadata:
  generateName: digital-notary-migrate-
  namespace: digital-notary
  annotations:
    vault.hashicorp.com/agent-inject: 'true'
    vault.hashicorp.com/role: digital-notary-api
    vault.hashicorp.com/agent-inject-secret-app.env: kv/data/digital-notary/api
    vault.hashicorp.com/agent-inject-template-app.env: |
      {{- with secret "kv/data/digital-notary/api" -}}
      {{- range $k, $v := .Data.data }}{{ $k }}={{ $v }}
      {{- end }}{{- end }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: digital-notary-migrate}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      restartPolicy: Never
      serviceAccountName: document-api
      containers:
      - name: migrate
        image: ghcr.io/replace-me/digital-notary:latest
        command: ["/migrate"]
        env: [{name: VAULT_ENV_FILE, value: /vault/secrets/app.env}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
