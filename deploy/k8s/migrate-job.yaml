apiVersion: batch/v1
kind: Job
metadata:
  generateName: digital-notary-migrate-
  namespace: digital-notary
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: digital-notary-migrate}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      restartPolicy: Never
      serviceAccountName: document-api
      containers:
      - name: migrate
        image: ghcr.io/replace-me/digital-notary:latest
        command: ["/migrate"]
        envFrom: [{secretRef: {name: digital-notary-runtime}}]
        volumeMounts:
        - name: postgres-ca
          mountPath: /etc/digital-notary
          readOnly: true
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
      volumes:
      - name: postgres-ca
        secret:
          secretName: digital-notary-runtime
          items: [{key: postgres-ca.crt, path: postgres-ca.crt}]
